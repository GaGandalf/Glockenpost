name: App bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: >
          gradle :app:assembleRelease --no-daemon
          -PcuratedUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/data/news.json
          -PversionCode=${{ github.run_number }}

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Glockenpost.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Glockenpost-APK
          path: Glockenpost.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Glockenpost 1.0.${{ github.run_number }}
          body: APK auf dem Android-Gerät herunterladen und installieren.
          files: Glockenpost.apk
          make_latest: true
